name: Playwright Tests

on:
  # Manual "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      path:
        description: 'Test folder or file to run (e.g. tests/WIOA, "tests/WYO DEV"). Leave as "tests" for everything.'
        required: true
        default: 'tests'
      grep:
        description: 'Only run tests whose title matches this (e.g. @release, @smoke, "WIOA adult"). Leave empty for all tests in the path.'
        required: false
        default: '@release'

  # Fired by the app repo's release workflow (see README "CI" section)
  repository_dispatch:
    types: [app-release]

  # Optional nightly regression - uncomment to enable (times are UTC)
  # schedule:
  #   - cron: '0 10 * * 1-5'

# Don't let two runs hit the same test accounts at the same time
concurrency:
  group: playwright-tests
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 300
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Google Chrome
      run: npx playwright install --with-deps chrome

    - name: Run Playwright tests
      env:
        # Repo secrets the tests read via process.env - add a line here when a test needs a new one
        WYO_DEV_LOGIN: ${{ secrets.WYO_DEV_LOGIN }}
        DEV_PASS: ${{ secrets.DEV_PASS }}
        WYO_OLDDEV_LOGIN: ${{ secrets.WYO_OLDDEV_LOGIN }}
        OLD_DEV_PASS: ${{ secrets.OLD_DEV_PASS }}
        WYO_PPP_LOGIN: ${{ secrets.WYO_PPP_LOGIN }}
        PPP_PASS: ${{ secrets.PPP_PASS }}
        CASEMAN_WYO_EMAIL: ${{ secrets.CASEMAN_WYO_EMAIL }}
        CENTERMAN_EMAIL: ${{ secrets.CENTERMAN_EMAIL }}
        CENTERMAN_DEV_PASS: ${{ secrets.CENTERMAN_DEV_PASS }}
        CENTERMAN_PPP_PASS: ${{ secrets.CENTERMAN_PPP_PASS }}
        STATE_AD_EMAIL_DEV: ${{ secrets.STATE_AD_EMAIL_DEV }}
        STATE_AD_DEV_PASS: ${{ secrets.STATE_AD_DEV_PASS }}
        STATE_AD_EMAIL_PPP: ${{ secrets.STATE_AD_EMAIL_PPP }}
        STATE_AD_PPP_PASS: ${{ secrets.STATE_AD_PPP_PASS }}
        SUPERAD_WYO_PPP_EMAIL: ${{ secrets.SUPERAD_WYO_PPP_EMAIL }}
        SUPERAD_WYO_PPP_PASS: ${{ secrets.SUPERAD_WYO_PPP_PASS }}
        JOBSIK_NAME: ${{ secrets.JOBSIK_NAME }}
        JOBSIK_EMAIL: ${{ secrets.JOBSIK_EMAIL }}
        JOBSIK_PASS: ${{ secrets.JOBSIK_PASS }}
        JOBSIK_DUMPONE_PASS: ${{ secrets.JOBSIK_DUMPONE_PASS }}
        JOBSIK_DUMPTWO_PASS: ${{ secrets.JOBSIK_DUMPTWO_PASS }}
        JOBSIK_DUMPTHREE_PASS: ${{ secrets.JOBSIK_DUMPTHREE_PASS }}
        WYO_JOBSIK_REG: ${{ secrets.WYO_JOBSIK_REG }}
        OREGON_LOGIN: ${{ secrets.OREGON_LOGIN }}
        OR_PASS: ${{ secrets.OR_PASS }}
        CASEMAN_OR_EMAIL: ${{ secrets.CASEMAN_OR_EMAIL }}
        CENTERMAN_OR_EMAIL: ${{ secrets.CENTERMAN_OR_EMAIL }}
        CENTERMAN_OR_PASS: ${{ secrets.CENTERMAN_OR_PASS }}
        VOUCHERREV_OR_EMAIL: ${{ secrets.VOUCHERREV_OR_EMAIL }}
        VOUCHERREV_OR_PASS: ${{ secrets.VOUCHERREV_OR_PASS }}
        OR_UAT_CASEMAN_EMAIL: ${{ secrets.OR_UAT_CASEMAN_EMAIL }}
        OR_UAT_CASEMAN_PASS: ${{ secrets.OR_UAT_CASEMAN_PASS }}
        OR_UAT_STATEAD_EMAIL: ${{ secrets.OR_UAT_STATEAD_EMAIL }}
        OR_UAT_STATEAD_PASS: ${{ secrets.OR_UAT_STATEAD_PASS }}

        # Release/scheduled runs use the @release tag; manual runs use the form inputs
        TEST_PATH: ${{ github.event.inputs.path || 'tests' }}
        TEST_GREP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grep || '@release' }}
        RELEASE_VERSION: ${{ github.event.client_payload.version }}
      run: |
        echo "Path: $TEST_PATH | Grep: ${TEST_GREP:-<none>} | App version: ${RELEASE_VERSION:-n/a}"
        # Warn (without failing) about secrets that are missing in Settings > Secrets, so a blank
        # login shows up here instead of as a confusing timeout later
        for name in $(grep -oE 'secrets\.[A-Za-z0-9_]+' .github/workflows/playwright.yml | cut -d. -f2 | sort -u); do
          [ -z "${!name}" ] && echo "::warning title=Missing secret::$name is empty - add it under Settings > Secrets and variables > Actions > Secrets"
        done
        if [ -n "$TEST_GREP" ]; then
          npx playwright test "$TEST_PATH" --grep "$TEST_GREP"
        else
          npx playwright test "$TEST_PATH"
        fi

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ github.run_number }}
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: test-results-${{ github.run_number }}
        path: test-results/
        retention-days: 14
