<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAA program benefits</title>
<style>
  :root {
    --maroon: #5C2320;
    --maroon-dark: #43191A;
    --cream: #FAF7F2;
    --page-bg: #F3F1EC;
    --border: #E3DFD6;
    --border-strong: #C9C3B6;
    --text-primary: #1F1B18;
    --text-secondary: #6B6459;
    --text-muted: #9A9284;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  h1.page-title {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 20px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .tab-btn {
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active {
    background: var(--maroon);
    color: #fff;
    border-color: var(--maroon);
  }
  .layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 20px;
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
  }
  .side-card {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 16px;
    text-align: center;
    height: fit-content;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--maroon);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 18px;
    margin: 0 auto 12px;
  }
  .side-title {
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 4px;
  }
  .side-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 14px;
  }
  .side-status {
    border-top: 1px solid var(--border);
    margin-top: 14px;
    padding-top: 14px;
    text-align: left;
  }
  .side-status p { margin: 0; }
  .side-status .label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .side-status .value { font-size: 13px; font-weight: 600; }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .card-header span.title {
    font-weight: 600;
    font-size: 14px;
    padding-right: 12px;
  }
  .card-header .icons {
    display: flex;
    gap: 14px;
    flex-shrink: 0;
    align-items: center;
  }
  .icon-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
  }
  .chevron {
    transition: transform 0.15s ease;
    display: inline-block;
  }
  .chevron.collapsed { transform: rotate(-90deg); }
  .card-body {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    padding: 16px;
  }
  @media (max-width: 560px) {
    .card-body { grid-template-columns: 1fr 1fr; }
  }
  .field .label {
    font-size: 11px;
    color: var(--text-muted);
    margin: 0 0 3px;
  }
  .field .value {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }
</style>
</head>
<body>
<div class="page">
  <h1 class="page-title">TAA program benefits</h1>
  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <div class="side-card">
      <div class="avatar" id="avatar">02</div>
      <p class="side-title" id="side-title">2002 program</p>
      <p class="side-sub" id="side-sub">Petitions 50,000–69,999</p>
      <div class="side-status">
        <p class="label">Status</p>
        <p class="value">Active reference set</p>
      </div>
    </div>

    <div id="sections-wrap"></div>
  </div>
</div>

<script>
const data = {
  "2002": {
    initials: "02", sub: "Petitions 50,000\u201369,999",
    ge: [["Sectors covered","Manufacturing only"],["ITC worker eligibility","No"],["Trade impact basis","Imports or outsourcing to FTA country"],["Temp agency workers auto-included","No"]],
    tr: [["Occupational training max (weeks)","104"],["Remedial extension (weeks)","up to 26"],["OJT max (weeks)","104"],["Apprenticeship max (weeks)","N/A"],["Employer wage reimbursement","N/A"]],
    jsa: [["Allowable job search cost","90%"],["Maximum","$1,250"],["State opt-in required","No"]],
    rel: [["Allowable relocation cost","90%"],["Maximum lump sum","$1,250"],["State opt-in required","No"]],
    ws: [["Program name","ATAA"],["Separate group certification","Yes"],["Salary threshold","< $50,000"],["Maximum total benefit","$10,000"],["Reemployment deadline (weeks)","26"],["Reemployment type","Full time only"],["Training benefit included","No"]],
    hc: [["Premium coverage","72.5%"]]
  },
  "2009": {
    initials: "09", sub: "Petitions 70,000\u201379,999",
    ge: [["Sectors covered","Manufacturing, service, public"],["ITC worker eligibility","Yes"],["Trade impact basis","Imports or outsourcing to any country"],["Temp agency workers auto-included","No"]],
    tr: [["Occupational training max (weeks)","130"],["Total cap incl. remedial (weeks)","156"],["OJT max (weeks)","104"],["Apprenticeship max (weeks)","130"],["Employer wage reimbursement","N/A"]],
    jsa: [["Allowable job search cost","100%"],["Maximum","$1,500"],["State opt-in required","No"]],
    rel: [["Allowable relocation cost","100%"],["Maximum lump sum","$1,500"],["State opt-in required","No"]],
    ws: [["Program name","RTAA"],["Separate group certification","No"],["Salary threshold","< $55,000"],["Maximum total benefit","$12,000"],["Reemployment deadline (weeks)","None"],["Reemployment type","Full or part time + training"],["Training benefit included","Yes"]],
    hc: [["Premium coverage","72.5%"]]
  },
  "2011": {
    initials: "11", sub: "Served under Final Rule 2020",
    ge: [["Sectors covered","Manufacturing, service"],["ITC worker eligibility","Yes"],["Trade impact basis","Imports or outsourcing to any country"],["Temp agency workers auto-included","No"]],
    tr: [["Occupational training max (weeks)","130"],["Remedial included in cap","Yes"],["OJT max (weeks)","104"],["Apprenticeship max (weeks)","130"],["Employer wage reimbursement","N/A"]],
    jsa: [["Allowable job search cost","90%"],["Maximum","$1,250"],["State opt-in required","Yes"]],
    rel: [["Allowable relocation cost","90%"],["Maximum lump sum","$1,250"],["State opt-in required","Yes"]],
    ws: [["Program name","RTAA"],["Separate group certification","No"],["Salary threshold","< $50,000"],["Maximum total benefit","$10,000"],["Reemployment deadline (weeks)","None"],["Reemployment type","Full or part time + training"],["Training benefit included","Yes"]],
    hc: [["Premium coverage","72.5%"]]
  },
  "2015": {
    initials: "15", sub: "Served under Final Rule 2020",
    ge: [["Sectors covered","Manufacturing, service"],["ITC worker eligibility","Yes"],["Trade impact basis","Imports or outsourcing to any country"],["Temp agency workers auto-included","No"]],
    tr: [["Occupational training max (weeks)","130"],["Remedial included in cap","Yes"],["OJT max (weeks)","104"],["Apprenticeship max (weeks)","130"],["Employer wage reimbursement","N/A"]],
    jsa: [["Allowable job search cost","90%"],["Maximum","$1,250"],["State opt-in required","Yes"]],
    rel: [["Allowable relocation cost","90%"],["Maximum lump sum","$1,250"],["State opt-in required","Yes"]],
    ws: [["Program name","RTAA"],["Separate group certification","No"],["Salary threshold","< $50,000"],["Maximum total benefit","$10,000"],["Reemployment deadline (weeks)","None"],["Reemployment type","Full or part time + training"],["Training benefit included","Yes"]],
    hc: [["Premium coverage","72.5%"]]
  },
  "Final Rule 2020": {
    initials: "FR", sub: "Supersedes 20 CFR 617",
    ge: [["Sectors covered","Manufacturing, service"],["ITC worker eligibility","Yes"],["Trade impact basis","Imports or outsourcing to any country"],["Temp agency workers auto-included","Yes"]],
    tr: [["Occupational training max (weeks)","130"],["Remedial included in cap","Yes"],["OJT max (weeks)","104"],["Apprenticeship max (weeks)","130"],["Employer wage reimbursement","50%"]],
    jsa: [["Allowable job search cost","90%"],["Maximum","$1,250"],["State opt-in required","No"]],
    rel: [["Allowable relocation cost","90%"],["Maximum lump sum","$1,250"],["State opt-in required","No"]],
    ws: [["Program name","RTAA"],["Separate group certification","No"],["Salary threshold","< $50,000"],["Maximum total benefit","$10,000"],["Reemployment deadline (weeks)","Yes, unspecified"],["Reemployment type","Full or part time + training"],["Training benefit included","Yes"]],
    hc: [["Premium coverage","72.5%"]]
  }
};

const years = Object.keys(data);

const cardDefs = [
  { key: "ge", label: "Group Eligibility" },
  { key: "tr", label: "Training" },
  { key: "jsa", label: "Job Search Allowances" },
  { key: "rel", label: "Relocation Allowances" },
  { key: "ws", label: "Alternative Trade Adjustment Assistance/Reemployment Trade Adjustment Assistance" },
  { key: "hc", label: "Health Coverage Tax Credit" }
];

function fieldHtml(pair) {
  return '<div class="field"><p class="label">' + pair[0] + '</p><p class="value">' + pair[1] + '</p></div>';
}

const editIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
const chevronIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

const sectionsWrap = document.getElementById('sections-wrap');
cardDefs.forEach(function(c) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="card-header" data-key="' + c.key + '">' +
      '<span class="title">' + c.label + '</span>' +
      '<span class="icons">' +
        '<button class="icon-btn" type="button" aria-label="Edit ' + c.label + '" onclick="event.stopPropagation()">' + editIcon + '</button>' +
        '<span class="icon-btn chevron" data-key="' + c.key + '">' + chevronIcon + '</span>' +
      '</span>' +
    '</div>' +
    '<div class="card-body" data-key="' + c.key + '"></div>';
  sectionsWrap.appendChild(card);
});

sectionsWrap.querySelectorAll('.card-header').forEach(function(h) {
  h.addEventListener('click', function() {
    const key = h.getAttribute('data-key');
    const body = sectionsWrap.querySelector('.card-body[data-key="' + key + '"]');
    const chevron = sectionsWrap.querySelector('.chevron[data-key="' + key + '"]');
    const collapsed = body.style.display === 'none';
    body.style.display = collapsed ? 'grid' : 'none';
    chevron.classList.toggle('collapsed', !collapsed);
  });
});

function render(year) {
  const d = data[year];
  document.getElementById('avatar').textContent = d.initials;
  document.getElementById('side-title').textContent = year.toLowerCase().includes('final') ? 'Final Rule 2020' : year + ' program';
  document.getElementById('side-sub').textContent = d.sub;
  cardDefs.forEach(function(c) {
    const body = sectionsWrap.querySelector('.card-body[data-key="' + c.key + '"]');
    body.innerHTML = d[c.key].map(fieldHtml).join('');
    body.style.display = 'grid';
    const chevron = sectionsWrap.querySelector('.chevron[data-key="' + c.key + '"]');
    chevron.classList.remove('collapsed');
  });
  years.forEach(function(y) {
    document.getElementById('tab-' + y.replace(/\s+/g, '')).classList.toggle('active', y === year);
  });
}

const tabsEl = document.getElementById('tabs');
years.forEach(function(y) {
  const btn = document.createElement('button');
  btn.id = 'tab-' + y.replace(/\s+/g, '');
  btn.className = 'tab-btn';
  btn.type = 'button';
  btn.textContent = y;
  btn.onclick = function() { render(y); };
  tabsEl.appendChild(btn);
});

render("2002");
</script>
</body>
</html>
