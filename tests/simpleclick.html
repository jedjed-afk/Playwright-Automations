<!DOCTYPE html>
<html>
    <head>
        <title>Button Click</title>
        <style>
            body {
                font-family: 'Courier New', Courier, monospace;
                text-align: center;
                margin-top: 70px;
            }
            .button-style {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
    
            }
            .counter-style {
                margin-top: 20px;
                font-size: 20px;
            }
        </style>
    </head>

    <body>
        <button id="clickButton" class="button-style" data-action="increment" role="button">Please Click</button>
        <div id="counter" class="counter-style" data-counter="number">0</div>
    </body>

    <script>
        let count = 0;
        const button = document.getElementById("clickButton");
        const counter = document.getElementById("counter")

        button.onclick = function() {
            count++;
            counter.innerText = count;
        }
    </script>
</html>
